name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Accept Android SDK licenses (preinstalled SDK)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: Build release APKs
        run: gradle -p "$GITHUB_WORKSPACE" assembleRelease --console=plain

      - name: Package only Car + Phone
        run: |
          mkdir -p out
          # Release 只保留两个 APK：车机 + 手机（含稳定文件名供二维码）
          cp app/build/outputs/apk/release/app-release.apk out/IcarLyrics-Car.apk
          cp phone/build/outputs/apk/release/phone-release.apk out/IcarLyrics-Phone.apk

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            out/IcarLyrics-Car.apk
            out/IcarLyrics-Phone.apk

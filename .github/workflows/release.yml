name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Accept Android SDK licenses (preinstalled SDK)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: Build both APKs
        run: gradle -p "$GITHUB_WORKSPACE" assembleDebug --console=plain

      - name: Rename artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/IcarLyrics-Car-${GITHUB_REF_NAME:-manual}.apk"
          cp phone/build/outputs/apk/debug/phone-debug.apk "out/IcarLyrics-Phone-${GITHUB_REF_NAME:-manual}.apk"
          # 稳定文件名：车机二维码固定指向 latest/download/IcarLyrics-Phone.apk
          cp app/build/outputs/apk/debug/app-debug.apk "out/IcarLyrics-Car.apk"
          cp phone/build/outputs/apk/debug/phone-debug.apk "out/IcarLyrics-Phone.apk"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: out/*.apk

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.icarme.lyrics'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.icarme.lyrics'
        minSdk 28          /* iCAR 03 车机 = Android 9 */
        targetSdk 28       /* 与原厂系统对齐，避免新版本行为差异 */
        versionCode 3
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

/* 零第三方依赖：全部使用 Android SDK 内置 API */
dependencies {
}

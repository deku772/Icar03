<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>IcarLyrics</title>
<style>
  /* ============================================================
   * IcarLyrics 渲染前端 v2.1（DOM + 合成器动画重写版）
   *
   * v2.0 及之前用 Canvas 每帧全屏重绘 + shadowBlur，车机 Android 9
   * WebView 低端 GPU 上掉帧卡顿。本版改为官方 03歌词 同款架构：
   *   - 歌词行是一次性构建的 DOM 节点，切行只 toggle class
   *   - 滚动 = 容器 translate3d + CSS transition（合成器补间，零 JS 逐帧）
   *   - 当前行字号变化用 FLIP（起始 transform → reflow → 释放给 transition）
   *   - 阴影/渐隐/呼吸全部走 CSS（text-shadow/mask/animation）
   *   - 放弃逐字卡拉OK填充（行级同步），这是流畅的关键取舍
   * 数据协议不变：IcarJS.onLyrics/onProgress/onCmd
   * ============================================================ */
  :root{
    --fs: 34px; --fs-near: 40px; --fs-active: 48px; --fs-trans: 19px; --pad: 13px;
    --line-h: 76px;
    --motion: 280ms cubic-bezier(.22,.75,.18,1);
    --fg:#FFFFFF; --near:rgba(255,255,255,.86); --past:rgba(255,255,255,.42);
    --far:rgba(255,255,255,.68); --shadow:0 2px 12px rgba(0,0,0,.72);
    --dim:rgba(255,255,255,.55);
    --focus:#5BA0FF;           /* 屏幕中央三行强调色（与底色区分） */
    --focus-near:#7EB6FF;
    --align:center;
  }
  body.theme-light{
    --fg:#171B21; --near:rgba(20,27,35,.88); --past:rgba(20,27,35,.42);
    --far:rgba(20,27,35,.62); --shadow:0 2px 8px rgba(255,255,255,.75);
    --dim:rgba(20,27,35,.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:transparent;
    font-family:"MiSans","HarmonyOS Sans SC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-user-select:none;user-select:none;}
  /* 不用 inset 简写（Chrome 87+ 才支持，车机老 WebView 不认会导致舞台零尺寸） */
  #stage{position:fixed;top:0;left:0;width:100%;height:100%;overflow:hidden;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 10%,#000 80%,transparent 100%);
    mask-image:linear-gradient(to bottom,transparent 0,#000 10%,#000 80%,transparent 100%);}
  body.no-lyrics #stage{display:none;}
  /* 暂停或未连蓝牙超过 10s：歌词淡出隐藏 */
  body.idle-hide #stage{opacity:0;pointer-events:none;}
  #stage{transition:opacity .45s ease;}
  /* 从上沿起滚：原点在舞台顶部；行数不够居中时贴上边，够了再沉到屏幕中央 */
  #lyrics{position:absolute;top:0;left:0;right:0;padding:0 20px;
    will-change:transform;transition:transform var(--motion);}
  #lyrics.no-anim{transition:none;}
  /* 固定行高：放大只改字号，不改 offsetTop */
  .line{
    height:var(--line-h);padding:0;color:var(--far);font-size:var(--fs);
    line-height:var(--line-h);font-weight:620;text-align:var(--align);
    opacity:1;overflow:visible;white-space:nowrap;
    transition:opacity var(--motion) ease,color 160ms ease;
  }
  .line .orig{display:inline-block;vertical-align:middle;
    transition:font-size var(--motion),color var(--motion);}
  .line .trans{display:none;margin-top:2px;font-size:var(--fs-trans);line-height:1.25;
    font-weight:560;opacity:.85;}
  body.has-trans .line.has-trans{line-height:calc(var(--line-h) * 0.72);}
  body.has-trans .line.has-trans .trans{display:block;}
  .line.near{color:var(--focus);}
  .line.past{color:var(--past);}
  /* 屏幕中央三行：同色同大，只用阴影区分当前行 */
  .line.near .orig{font-size:var(--fs-active);}
  .line.active{color:var(--focus);font-weight:820;}
  .line.active .orig{font-size:var(--fs-active);text-shadow:var(--shadow);}
  .line.active .trans{color:var(--focus);font-weight:620;opacity:.9;}
  .line.near .trans{color:var(--focus);opacity:.75;}
  body.paused .line.active .orig{animation:breathe 2.4s ease-in-out infinite;}
  @keyframes breathe{50%{opacity:.55;}}
  /* 地图模式：歌词收到屏幕底部、更小更透，不挡路线 */
  body.mode-map #lyrics{padding-bottom:8%;}
  body.mode-map .line{height:calc(var(--line-h) * 0.72);line-height:calc(var(--line-h) * 0.72);}
  body.mode-map{--fs:22px;--fs-active:30px;--fs-near:30px;--fs-trans:14px;--line-h:44px;}
  body.mode-map .line .orig{opacity:.92;}
  body.mode-map .line.active .orig{text-shadow:0 1px 8px rgba(0,0,0,.85);}
  /* 居中左：文字仍居中，整块偏左（右侧留更多空） */
  #lyrics.align-left{padding-left:6%;padding-right:22%;text-align:center;}
  /* 居中右：对称 */
  #lyrics.align-right{padding-right:6%;padding-left:22%;text-align:center;}
  /* 系统设置页：歌词大幅让开，避免挡住热点/授权界面 */
  body.mode-settings #stage{opacity:.12;pointer-events:none;}
  body.mode-settings #hint{opacity:0;}
  #hint{position:fixed;top:2.4vh;left:0;right:0;text-align:center;color:var(--dim);
    font-size:17px;line-height:1.7;transition:opacity .3s;}
  #hint .sub{font-size:13px;opacity:.75;}
  body.no-lyrics #hint{opacity:1;}
  body:not(.no-lyrics) #hint{opacity:0;}
  /* 偏移调节提示（clean 模式也显示，保证调节有反馈） */
  #offsetToast{position:fixed;top:10%;left:50%;transform:translateX(-50%);
    z-index:20;padding:10px 22px;border-radius:24px;
    background:rgba(8,12,20,.82);color:#fff;font-size:18px;font-weight:600;
    letter-spacing:.02em;opacity:0;pointer-events:none;
    transition:opacity .22s ease;border:1px solid rgba(255,255,255,.12);
    text-shadow:0 1px 8px rgba(0,0,0,.55);}
  #offsetToast.show{opacity:1;}
  body.theme-light #offsetToast{background:rgba(255,255,255,.92);color:#171B21;
    border-color:rgba(0,0,0,.08);}
  /* 演示面板（浏览器调试用；车机由 clean 模式隐藏） */
  #panel{position:fixed;right:10px;top:10px;z-index:9;background:rgba(20,22,30,.92);
    color:#e8eaf0;border:1px solid rgba(255,255,255,.15);border-radius:10px;
    padding:10px 14px;font-size:13px;line-height:1.9;min-width:180px;}
  #panel h3{margin:0 0 4px;font-size:13px;color:#7fb0ff;font-weight:600;}
  #panel .row{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0;}
  #panel button{flex:1;padding:4px 8px;font-size:12px;color:#e8eaf0;background:#2c3242;
    border:1px solid rgba(255,255,255,.16);border-radius:6px;cursor:pointer;}
  #panel button.on{background:#2f6fd8;border-color:#5b93f0;}
  #panel .stat{color:#8a93a8;font-size:11px;margin-top:6px;}
  body.clean #panel{display:none;}
</style>
</head>
<body class="theme-dark no-lyrics">
<div id="stage"><div id="lyrics"></div></div>
<div id="hint">等待手机连接…</div>
<div id="offsetToast"></div>
<div id="panel">
  <h3>IcarLyrics 演示台</h3>
  <div class="row">
    <button id="bPlay">播放</button>
    <button id="bLoop" class="on">循环 开</button>
    <button id="tDark" class="on">深色</button>
    <button id="tLight">浅色</button>
  </div>
  <div class="stat" id="stat">初始化…</div>
</div>

<script>
'use strict';
/* ---------------- 状态 ---------------- */
var S = {
  playing:false, positionMs:0, syncedAt:0, durationMs:0,
  track:'', source:'',
  lines:[],            /* [{t,txt,trans}] 行级同步（忽略逐字标签） */
  cur:-1,
  offsetMs:0,          /* 用户歌词偏移：正=提前（词晚于声时用），负=延后 */
  offsetBumped:0,      /* 时间戳：刚改过偏移时跳过防回跳一次 */
  lineH:72,            /* 固定行高缓存，滚动定位用 */
  switchGeneration:0,  /* 换歌/重建代数，防止旧动画回调污染新 DOM */
  connected:false, advState:'', rxFrag:0, rxFrame:0, rxProg:0, rxBrief:'',
  demo:false, loop:true,
  lastActiveAt:0, idleHideMs:10000, idleHidden:false,
  debug:false
};

var FONT = '"MiSans","HarmonyOS Sans SC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif';
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
/* 偏移在渲染层生效：调节立即重定位（暂停时也生效），与进度包解耦 */
function nowMs(){
  var t = S.playing ? S.positionMs + (Date.now()-S.syncedAt) : S.positionMs;
  return t + S.offsetMs;
}

/* ---------------- LRC 解析（行级） ---------------- */
function parseTimeTag(s){
  var m = /^(\d+):(\d+(?:\.\d+)?)$/.exec(s);
  if (!m) return -1;
  return Math.round(parseInt(m[1],10)*60000 + parseFloat(m[2])*1000);
}
var RE_HEAD = /^\s*((?:\[\d+:\d+(?:\.\d+)?\])+)/;
var RE_TAG  = /\[\d+:\d+(?:\.\d+)?\]/g;
var RE_INLINE = /<\d+:\d+(?:\.\d+)?>/g;
var RE_CREDIT = /^(作词|作曲|编曲|制作人|混音|母带|录音|和声|监制|出品|发行|翻译|词|曲)\s*[：:]/i;

function parseLrcText(text){
  var rows = String(text||'').replace(/\r/g,'').split('\n');
  var out = [];
  for (var i=0;i<rows.length;i++){
    var head = RE_HEAD.exec(rows[i]);
    if (!head) continue;
    /* 行级同步：保留行时间戳，剥离逐字 <mm:ss.xx> 元数据 */
    var txt = rows[i].slice(head[1].length).replace(RE_INLINE,'').trim();
    if (!txt || RE_CREDIT.test(txt)) continue;
    var tags = head[1].match(RE_TAG) || [];
    for (var j=0;j<tags.length;j++){
      var t = parseTimeTag(tags[j].slice(1,-1));
      if (t>=0) out.push({ t:t, txt:txt, trans:'' });
    }
  }
  out.sort(function(a,b){ return a.t-b.t; });
  var dedup = [];
  for (var k=0;k<out.length;k++){
    if (k && out[k].t===out[k-1].t && out[k].txt===out[k-1].txt) continue;
    dedup.push(out[k]);
  }
  return dedup;
}

/* 翻译对齐：±300ms 容差最近邻，一对一 */
function alignTrans(lines, tlyric){
  if (!tlyric) return;
  var rows = String(tlyric).replace(/\r/g,'').split('\n'), tr = [];
  for (var i=0;i<rows.length;i++){
    var head = RE_HEAD.exec(rows[i]);
    if (!head) continue;
    var body = rows[i].slice(head[1].length).replace(RE_INLINE,'').trim();
    if (!body || RE_CREDIT.test(body)) continue;
    var tags = head[1].match(RE_TAG) || [];
    for (var j=0;j<tags.length;j++){
      var t = parseTimeTag(tags[j].slice(1,-1));
      if (t>=0) tr.push({ t:t, txt:body });
    }
  }
  tr.sort(function(a,b){ return a.t-b.t; });
  var used = {};
  for (var n=0;n<lines.length;n++){
    var best = -1, bestDiff = 301;
    for (var m=0;m<tr.length;m++){
      if (used[m]) continue;
      var d = Math.abs(tr[m].t - lines[n].t);
      if (d < bestDiff){ bestDiff = d; best = m; }
    }
    if (best >= 0){ lines[n].trans = tr[best].txt; used[best] = true; }
  }
}

/* ---------------- JS 桥（Android 下发入口，协议与 v2.0 一致） ---------------- */
function safeParse(json){ try { return JSON.parse(json); } catch(e){ return null; } }

function handleLyrics(msg){
  S.track = msg.track || '';
  if (msg.durationMs) S.durationMs = msg.durationMs;
  S.lines = parseLrcText(msg.lrc || '');
  alignTrans(S.lines, msg.tlyric || '');
  S.cur = -1;
  S.switchGeneration++;
  if (msg.resetProgress){ S.positionMs = 0; S.syncedAt = Date.now(); }
  buildDom();
  updateVisibility();
  positionToCurrent(true);
  markActive();
  notify({ event:'lyricsLoaded', data:{ count:S.lines.length, track:S.track } });
}

function handleProgress(msg){
  S.positionMs = Math.max(0, msg.positionMs|0);
  S.playing = !!msg.playing;
  S.syncedAt = Date.now();
  if (msg.durationMs) S.durationMs = msg.durationMs;
  document.body.classList.toggle('paused', !S.playing);
  if (S.playing) markActive();
  else evaluateIdleHide();
}

function handleCmd(msg){
  if (msg.type === 'conn'){
    if (typeof msg.advState === 'string') S.advState = msg.advState;
    if (typeof msg.connected === 'boolean') S.connected = msg.connected;
    if (S.connected) markActive();
    else evaluateIdleHide();
    updateVisibility();
    return;
  }
  if (msg.action === 'rxStats'){
    if (typeof msg.frag === 'number') S.rxFrag = msg.frag;
    if (typeof msg.frame === 'number') S.rxFrame = msg.frame;
    if (typeof msg.prog === 'number') S.rxProg = msg.prog;
    if (typeof msg.brief === 'string') S.rxBrief = msg.brief;
    updateVisibility();
    return;
  }
  var a = msg.action;
  if (a === 'clear'){ S.lines = []; S.cur = -1; S.switchGeneration++; buildDom(); updateVisibility(); }
  else if (a === 'setTheme' && (msg.value==='dark'||msg.value==='light')){
    document.body.classList.toggle('theme-dark', msg.value==='dark');
    document.body.classList.toggle('theme-light', msg.value==='light');
  }
  else if (a === 'setOffset' && typeof msg.value === 'number'){
    S.offsetMs = msg.value;
    S.offsetBumped = Date.now();
    /* 偏移变化立即重定位到新当前行（不等待下一个进度包） */
    if (S.lines.length){
      var idx = findLine(nowMs());
      if (idx < 0) idx = 0;
      if (idx !== S.cur) switchTo(idx);
      else positionToCurrent(true);
    }
    if (msg.toast !== false) showOffsetToast(S.offsetMs);
  }
  else if (a === 'setAlign'){
    var al = msg.value;
    if (al === 'left' || al === 'center' || al === 'right') {
      document.documentElement.style.setProperty('--align', al);
      document.body.classList.remove('align-left', 'align-right');
      if (al === 'left') document.body.classList.add('align-left');
      if (al === 'right') document.body.classList.add('align-right');
    }
  }
  else if (a === 'setScene'){
    var sc = msg.value;
    document.body.classList.toggle('mode-map', sc === 'map');
    document.body.classList.toggle('mode-wallpaper', sc === 'wallpaper');
    document.body.classList.toggle('mode-settings', sc === 'settings');
    layoutMetrics();
    if (S.lines.length) positionToCurrent(true);
  }
  else if (a === 'setDebug'){
    S.debug = !!msg.value;
    updateVisibility();
  }
  else if (a === 'setColor'){
    var c = msg.value;
    /* [正文, 中央焦点, 相邻焦点, 已唱, 阴影] — 正文与焦点色必须拉开色相 */
    var pal = {
      white: ['#FFFFFF', '#0066FF', '#3D8FFF', 'rgba(255,255,255,.40)', '0 2px 12px rgba(0,0,0,.75)'],
      black: ['#111111', '#FFB300', '#FFC84D', 'rgba(17,17,17,.42)', '0 2px 10px rgba(255,255,255,.5)'],
      blue:  ['#E8F1FF', '#FF6B00', '#FF8F3D', 'rgba(90,150,230,.40)', '0 2px 12px rgba(0,0,0,.72)'],
      green: ['#E8FFF2', '#E91E63', '#FF5C8A', 'rgba(40,180,100,.40)', '0 2px 12px rgba(0,0,0,.72)'],
      amber: ['#FFF6E0', '#00BCD4', '#4DD0E1', 'rgba(200,140,20,.40)', '0 2px 12px rgba(0,0,0,.72)'],
      pink:  ['#FFEAF4', '#00C853', '#69F0AE', 'rgba(200,80,140,.40)', '0 2px 12px rgba(0,0,0,.72)']
    };
    var p = pal[c];
    if (p) {
      var rs = document.documentElement.style;
      rs.setProperty('--fg', p[0]);
      rs.setProperty('--focus', p[1]);
      rs.setProperty('--focus-near', p[2]);
      rs.setProperty('--past', p[3]);
      rs.setProperty('--far', c==='white' ? 'rgba(255,255,255,.68)' : p[0]);
      rs.setProperty('--near', p[2]);
      rs.setProperty('--shadow', p[4]);
    }
  }
  else if (a === 'ping'){ notify({ event:'pong', data:{ t:Date.now() } }); }
  syncPanel();
}

window.IcarJS = {
  version: '2.2.1',
  onLyrics:   function(json){ var m=safeParse(json); if(m) handleLyrics(m); },
  onProgress: function(json){ var m=safeParse(json); if(m) handleProgress(m); },
  onCmd:      function(json){ var m=safeParse(json); if(m) handleCmd(m); }
};

function notify(obj){
  if (window.NativeBridge && window.NativeBridge.post){
    try { window.NativeBridge.post(JSON.stringify(obj)); } catch(e){}
  } else if (S.demo) { console.log('[IcarJS->]', obj); }
}

/* ---------------- DOM 构建 ---------------- */
var stage, ly, hint;

function escapeHtml(v){
  return String(v||'').replace(/[&<>"']/g, function(ch){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
  });
}

function buildDom(){
  var hasTrans = false, html = '';
  for (var i=0;i<S.lines.length;i++){
    var ln = S.lines[i];
    if (ln.trans) hasTrans = true;
    html += '<div class="line" data-i="'+i+'"><div class="orig">'+escapeHtml(ln.txt)+'</div>'
          + (ln.trans ? '<div class="trans">'+escapeHtml(ln.trans)+'</div>' : '') + '</div>';
  }
  ly.innerHTML = html;
  document.body.classList.toggle('has-trans', hasTrans);
  layoutMetrics();
}

function updateVisibility(){
  var has = S.lines.length > 0;
  document.body.classList.toggle('no-lyrics', !has);
  if (!has){
    /* 默认静默：无歌词时不显示等待/分片调试；仅 debug 开时才展示 */
    if (!S.debug && !S.demo){
      hint.innerHTML = '';
      hint.style.opacity = '0';
      return;
    }
    hint.style.opacity = '';
    var msg;
    if (S.connected) msg = '已连接手机 · 等待放歌…';
    else if (S.advState) msg = S.advState;
    else msg = '等待手机连接…';
    var sub = '';
    if (S.rxFrag > 0 || S.rxProg > 0 || S.rxFrame > 0){
      sub = '<div class="sub">分片 '+S.rxFrag+' · 组帧 '+S.rxFrame+' · 进度 '+S.rxProg
          + (S.rxBrief ? ' · ' + S.rxBrief : '') + '</div>';
    }
    hint.innerHTML = escapeHtml(msg) + sub;
  }
}

/* ---------------- 布局度量（resize/换行时一次性设置 CSS 变量） ---------------- */
function layoutMetrics(){
  var h = window.innerHeight;
  var fs = clamp(h*0.042, 24, 42);
  /* 中央三行：相邻 +1 号，当前 +2 号 */
  var fsN = Math.round(fs * 1.18);
  var fsA = Math.round(fs * 1.38);
  var rs = document.documentElement.style;
  rs.setProperty('--fs', Math.round(fs)+'px');
  rs.setProperty('--fs-near', fsN+'px');
  rs.setProperty('--fs-active', fsA+'px');
  rs.setProperty('--fs-trans', Math.round(fs*0.55)+'px');
  S.lineH = Math.ceil(fsA * 1.28 + Math.round(fs*0.38) * 2);
  rs.setProperty('--line-h', S.lineH+'px');
  hint.style.fontSize = Math.round(clamp(h*0.024, 14, 20))+'px';
}

/* ---------------- 当前行定位与切换动画 ---------------- */
function applyStates(prev, idx){
  var nodes = ly.children;
  var lo = Math.max(0, Math.min(prev, idx)-2);
  var hi = Math.min(nodes.length-1, Math.max(prev, idx)+2);
  for (var i=0;i<nodes.length;i++){
    if (i<lo || i>hi) continue;
    var n = nodes[i];
    var isNear = i!==idx && Math.abs(i-idx)===1;
    n.classList.toggle('active', i===idx);
    n.classList.toggle('near', isNear);
    /* 上一被唱行若是 near，不再叠 past，避免样式打架只剩两行突出 */
    n.classList.toggle('past', i!==idx && i<idx && !isNear);
  }
}

function setLyricsTranslate(y){
  ly.style.transform = 'translate3d(0,'+y+'px,0)';
}

/** 定位当前行：
 *  开头几行贴屏幕上沿（从上往下滚）；
 *  上方行数够了之后，当前行沉到屏幕中央，中央±1 行用焦点色放大。 */
function positionToCurrent(instant){
  if (S.cur < 0) return;
  var stageH = stage.clientHeight;
  var lineCenter = S.cur * S.lineH + S.lineH * 0.5;
  var topMargin = stageH * 0.10;
  var desired;
  if (document.body.classList.contains('mode-map')) {
    /* 地图：当前行沉在屏幕下部 72% 处，不挡上半屏路线 */
    desired = stageH * 0.72;
  } else {
    desired = Math.min(stageH * 0.5, topMargin + lineCenter);
  }
  var target = desired - lineCenter;
  if (instant){
    ly.classList.add('no-anim');
    setLyricsTranslate(target);
    ly.offsetHeight;
    ly.classList.remove('no-anim');
    return;
  }
  setLyricsTranslate(target);
}

function switchTo(idx){
  var prev = S.cur;
  S.cur = idx;
  var bigJump = prev < 0 || Math.abs(idx-prev) > 1;
  applyStates(prev, idx);
  positionToCurrent(bigJump);
}

/* ---------------- 主循环（轻量：每帧仅二分比较，不触发布局/绘制） ---------------- */
function findLine(t){
  var idx = -1, lo = 0, hi = S.lines.length-1;
  while (lo <= hi){
    var mid = (lo+hi) >> 1;
    if (S.lines[mid].t <= t + 90){ idx = mid; lo = mid+1; } else hi = mid-1;
  }
  /* 刚调过偏移：立刻按新时间轴定位，不吃防回跳（否则小幅「延后」看起来没反应） */
  if (S.offsetBumped && (Date.now() - S.offsetBumped) < 400){
    S.offsetBumped = 0;
    return idx;
  }
  /* 防回跳：时间轴抖一下时不要闪回上一行（除非明显早于当前行 280ms） */
  if (S.cur >= 0 && idx < S.cur && S.cur < S.lines.length){
    if (t + 280 >= S.lines[S.cur].t) idx = S.cur;
  }
  return idx;
}

function tick(){
  if (S.lines.length){
    var t = nowMs();
    var idx = findLine(t);
    if (idx < 0) idx = 0;
    if (idx !== S.cur) switchTo(idx);
    evaluateIdleHide();
  }
  requestAnimationFrame(tick);
}

/** 暂停或未连蓝牙 10s 后隐藏悬浮歌词；恢复播放/连接立即显示 */
function markActive(){
  S.lastActiveAt = Date.now();
  if (S.idleHidden){
    S.idleHidden = false;
    document.body.classList.remove('idle-hide');
  }
}

function evaluateIdleHide(){
  if (S.demo || !S.lines.length) return;
  var live = S.playing && S.connected;
  if (live){
    markActive();
    return;
  }
  if (!S.lastActiveAt) S.lastActiveAt = Date.now();
  var idle = Date.now() - S.lastActiveAt;
  if (idle >= S.idleHideMs && !S.idleHidden){
    S.idleHidden = true;
    document.body.classList.add('idle-hide');
  }
}

/* ---------------- 演示模式（浏览器 / 无 NativeBridge） ---------------- */
var DEMO_LRC =
'[00:01.20]星河之外\n[00:05.00]夜色漫过车窗\n[00:09.50]路灯连成光带\n' +
'[00:14.50]载着我们流浪\n[00:19.50]风穿过指缝\n[00:23.50]吹散了彷徨\n' +
'[00:27.50]银河落在远方\n[00:31.50]像你眼睛发亮\n[00:35.50]夜风轻轻唱\n[00:39.50]伴我们去流浪\n';
var DEMO_TLYRIC =
'[00:01.20]Beyond the starry river\n[00:05.00]Night floods the car window\n' +
'[00:09.50]Streetlights weave a ribbon of light\n[00:14.50]Carrying us adrift\n' +
'[00:19.50]Wind slips through fingers\n[00:23.50]Blowing hesitation away\n';

function $(id){ return document.getElementById(id); }
var toastTimer = 0;
function showOffsetToast(ms){
  var el = $('offsetToast');
  if (!el) return;
  var label = ms === 0 ? '偏移 已同步'
    : (ms > 0 ? '提前 ' : '延后 ') + (Math.abs(ms) / 1000).toFixed(2) + 's';
  el.textContent = label;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1600);
}
function syncPanel(){
  if (!$('bPlay')) return;
  $('bPlay').textContent = S.playing ? '暂停' : '播放';
  $('bPlay').className = S.playing ? 'on' : '';
  $('bLoop').textContent = S.loop ? '循环 开' : '循环 关';
  $('bLoop').className = S.loop ? 'on' : '';
}
function bindPanel(){
  $('bPlay').onclick = function(){
    S.playing = !S.playing;
    /* 用原始媒体时间折叠，不能把 offsetMs 写回 positionMs（会双重偏移） */
    if (S.playing) {
      S.syncedAt = Date.now();
    } else {
      S.positionMs = S.positionMs + (Date.now() - S.syncedAt);
    }
    document.body.classList.toggle('paused', !S.playing);
    syncPanel();
  };
  $('bLoop').onclick = function(){ S.loop = !S.loop; syncPanel(); };
  $('tDark').onclick = function(){ handleCmd({action:'setTheme',value:'dark'}); };
  $('tLight').onclick = function(){ handleCmd({action:'setTheme',value:'light'}); };
  setInterval(function(){
    var s = S.playing ? nowMs() : S.positionMs + S.offsetMs;
    var mm = Math.floor(s/60000), ss = ('0'+Math.floor(s/1000)%60).slice(-2);
    $('stat').innerHTML = '桥: <b>演示模式</b> · '+mm+':'+ss
      + ' · 偏移 ' + (S.offsetMs>0?'+':'') + (S.offsetMs/1000).toFixed(2) + 's'
      + ' · ' + (S.lines.length ? S.lines.length+' 行' : '无歌词');
  }, 500);
}
function loadDemo(){
  handleLyrics({ track:'星河之外', durationMs:45000, lrc:DEMO_LRC, tlyric:DEMO_TLYRIC,
    source:'demo', resetProgress:true });
  S.playing = true; S.syncedAt = Date.now();
  document.body.classList.remove('paused');
  syncPanel();
}

/* ---------------- 启动 ---------------- */
function boot(){
  stage = $('stage'); ly = $('lyrics'); hint = $('hint');
  S.demo = (typeof window.NativeBridge === 'undefined');
  if (S.demo){
    document.body.classList.remove('clean');
    bindPanel();
    loadDemo();
  } else {
    document.body.classList.add('clean');
  }
  layoutMetrics();
  requestAnimationFrame(tick);
  if (!S.demo) notify({ event:'ready', data:{ version:'2.1.0' } });
}
window.addEventListener('resize', function(){ layoutMetrics(); positionToCurrent(true); });
window.addEventListener('orientationchange', function(){ setTimeout(function(){ layoutMetrics(); positionToCurrent(true); },200); });
boot();
</script>

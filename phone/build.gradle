plugins {
    id 'com.android.application'
}

android {
    namespace 'com.icarme.lyrics.phone'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.icarme.lyrics.phone'
        minSdk 28          /* 覆盖 Android 9+，红米 K20 Pro (Android 11) 可用 */
        targetSdk 28       /* 侧载 APK，低 target 减少 BLE/后台行为差异 */
        versionCode 6
        versionName '2.4.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

/* 零第三方依赖 */
dependencies {
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.icarme.lyrics.phone'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.icarme.lyrics.phone'
        minSdk 28          /* 覆盖 Android 9+，红米 K20 Pro (Android 11) 可用 */
        targetSdk 28       /* 侧载 APK，低 target 减少 BLE/后台行为差异 */
        versionCode 12
        versionName '2.5.2'
    }

    /* 与车机端同一把项目签名，CI/本地一致 */
    signingConfigs {
        project {
            storeFile file("${rootDir}/signing/icarlyrics.keystore")
            storePassword 'icarlyrics'
            keyAlias 'icarlyrics'
            keyPassword 'icarlyrics'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.project
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.project
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
}

/* ZXing：二维码（车机端下载码） */
dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
